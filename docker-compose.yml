services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sada}
      POSTGRES_DB: ${POSTGRES_DB:-sada}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sada} -d ${POSTGRES_DB:-sada}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sada}:${POSTGRES_PASSWORD:-sada}@db:5432/${POSTGRES_DB:-sada}
      UPLOAD_DIR: /app/data/uploads
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    volumes:
      - uploads:/app/data/uploads
      - modelcache:/home/sada/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  modelcache:
